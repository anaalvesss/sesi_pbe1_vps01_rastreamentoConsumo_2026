<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreamento de Consumo</title>
</head>
<body>
    <header><h1>Cadastro de Equipamentos</h1></header>
    <main>
        <form action="http://localhost:3000/equipamentos" method="post" target="frameEnvio">
            <input type="text" name="equipamento" placeholder="Nome do Equipamento" required>
            <input type="text" name="local" placeholder="Local de Instalação" required>
            <input type="text" name="consumo" step="0.01" placeholder="Consumo (kWh)" required>
            <input type="submit" value="Enviar">
        </form>
        <p>Equipamento cadastrado com sucesso!</p>
        <iframe name="frameEnvio" style="display: none;"></iframe>
    </main>
</body>
</html>
